# Supabase CLI config for Mazal.
#
# project_id is the linked project ref. The live project is `tayiyczmacvhokdxfqvm`
# (MEXA-246); the original `keossekxijwygksqsxel` no longer exists.
#
# Deploys from this box have no Docker, so bundle server-side:
#   supabase functions deploy --project-ref tayiyczmacvhokdxfqvm --use-api
project_id = "tayiyczmacvhokdxfqvm"

# All three functions are called with a bearer token (a user JWT for delete-account,
# the service_role key for the other two), so JWT verification stays on. Turning it off
# would make delete-account and the push sender callable by anyone on the internet.
[functions.delete-account]
verify_jwt = true

[functions.send-notification]
verify_jwt = true

[functions.cleanup-verification-photos]
verify_jwt = true

# Branded auth emails (MEXA-581). The HTML is generated by supabase/templates/build.mjs and
# pushed to the live project by supabase/templates/apply.mjs (Management API, mailer keys
# only); these blocks are what `supabase start` uses locally and the record of what is live.
# Old live versions: supabase/templates/rollback/live-before-mexa581.json.
[auth.email.template.confirmation]
subject = "Welcome to Mazal - confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Mazal password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Mazal sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Mazal"
content_path = "./supabase/templates/email_change.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your Mazal password was changed"
content_path = "./supabase/templates/password_changed_notification.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your Mazal email was changed"
content_path = "./supabase/templates/email_changed_notification.html"
